name: Build mod jar

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: totemoptimizer
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: totemoptimizer
          gradle-version: ${{ hashFiles('totemoptimizer/gradlew') == '' && '9.2.0' || '' }}

      - name: Build
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: totemoptimizer-jar
          path: |
            totemoptimizer/build/libs/*.jar
            !totemoptimizer/build/libs/*-sources.jar

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            totemoptimizer/build/libs/*.jar
            !totemoptimizer/build/libs/*-sources.jar
